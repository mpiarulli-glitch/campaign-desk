name: Production scheduling reminders

# Pings the reminder endpoint once a day. The endpoint figures out which
# clients are within 3 weeks of their production window and haven't booked
# yet, and emails them their scheduling link (once per day until they book).
#
# Requires a repository secret named CRON_SECRET whose value matches the
# CRON_SECRET environment variable set on the Railway service.

on:
  # Paused 2026-08-26 for the September production-week cutover.
  # Restore the schedule below when the calendar remap is done.
  # schedule:
  #   # 16:00 UTC daily (~9am Pacific). GitHub may delay scheduled runs a few
  #   # minutes; that's fine, the job only sends once per client per day.
  #   - cron: "0 16 * * *"
  # Lets you trigger a run by hand from the Actions tab to test.
  workflow_dispatch: {}

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose Ecoworkz outreach (dry run)
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer ${{ secrets.CRON_SECRET }}"
          BASE="https://hub.marketingempiregroup.com/api/cron/reminders"
          for TODAY in 2026-08-10 2026-08-14 2026-09-14 2026-09-21 2026-10-12; do
            echo "===== dryRun only=Ecoworkz today=$TODAY ====="
            curl -fsS --show-error -X POST \
              -H "$AUTH" \
              "$BASE?dryRun=1&only=Ecoworkz&today=$TODAY"
            echo
          done
          echo "===== dryRun only=Ecoworkz (real today) ====="
          curl -fsS --show-error -X POST \
            -H "$AUTH" \
            "$BASE?dryRun=1&only=Ecoworkz"
          echo
