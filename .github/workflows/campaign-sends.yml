name: Flip scheduled campaigns to Sent

# Marks review-package campaigns Sent once their stored Pacific send datetime
# has passed. Same auth shape as approval-thank-you.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  campaign-sends:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger scheduled-campaign sweep
        run: |
          curl -fsS --show-error -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://hub.marketingempiregroup.com/api/cron/campaign-sends
