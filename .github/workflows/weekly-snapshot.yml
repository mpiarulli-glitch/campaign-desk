name: Weekly snapshot ask

# Does not send the Friday ask. A signed-in admin sends one client at a time
# from Client Services (Friday ask tab, Send now). This workflow has no
# schedule. A manual Actions run only asks the hub for a dry run, and the
# cron endpoint refuses a live send even if that query flag is dropped.

on:
  workflow_dispatch:

jobs:
  weekly-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger weekly snapshot dry run
        run: |
          curl -fsS --show-error -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://hub.marketingempiregroup.com/api/cron/weekly-snapshot?dryRun=1"
